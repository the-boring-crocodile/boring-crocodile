<svg xmlns="http://www.w3.org/2000/svg" width="692pt" height="801pt" viewBox="0 0 692 801">
<rect x="0" y="0" width="692" height="801" fill="#121212"/>
<text x="20.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#dfdfdf" xml:space="preserve">The Crocodile: one server, a Unix account per Pond</text>
<text x="20.0" y="56.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">Container view · Crocodile 0.4.20</text>
<text x="20.0" y="72.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dfdfdf" xml:space="preserve">A client signs in to one Pond; the token picks the Pond; the Pond's account does the work.</text>
