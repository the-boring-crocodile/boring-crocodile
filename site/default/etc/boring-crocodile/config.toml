[server]
public_base_url = "https://mcp.example.invalid"
bind_host = "127.0.0.1"
bind_port = 8503
allowed_hosts = ["mcp.example.invalid", "mcp.example.invalid:443", "127.0.0.1:8503"]
[auth]
oauth_database_file = "/var/lib/boring-crocodile/oauth.sqlite3"
[ponds.pond]
profile_id = "00000000-0000-4000-8000-000000000001"
display_name = "The Pond"
environment = "pond"
approval_secret_file = "/run/credentials/boring-crocodile-mcp.service/approval-secret"
context_root = "/home/boring-crocodile/handbook"
files = ["HANDBOOK.md", "WELCOME.md"]
welcome_file = "WELCOME.md"
[environments.pond]
socket_path = "/run/boring-crocodile/workers/pond/control.sock"
task_socket_path = "/run/boring-crocodile/tasks/pond.sock"
task_unit_prefix = "boring-crocodile-task-pond"
task_cgroup_parent = "/system.slice/system-crocodilepond.slice"
default_cwd = "/home/boring-crocodile"
allowed_roots = ["/home/boring-crocodile"]
control_plane_uid = 902
output_limit_bytes = 65536
no_new_privileges = true
[environments.pond.files.roots.home]
path = "/home/boring-crocodile"
read = true
write = true
