[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-crocodile-mcp"
version = "0.4.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.md"]
description = "Authenticated MCP access to isolated personal workspaces"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<2.3",
    "pydantic>=2.13,<3",
    "starlette>=1.6,<2",
    "httpx2>=2.13,<2.14",
    "boring-task-state==0.3.5",
    "boring-file-core>=0.7.6,<0.8",
    "boring-worker-kit>=0.7.6,<0.8",
    "boring-registry>=0.7.6,<0.8",
    "boring-service-kit>=0.7.6,<0.8",
    "tomli>=2.2; python_version < '3.11'",
    "exceptiongroup>=1.3; python_version < '3.11'",
]

[project.scripts]
boring-crocodile-admin = "boring_crocodile.admin:main"
boring-crocodile-render-services = "boring_crocodile.setup_services:main"
boring-crocodile-setup = "boring_crocodile.setup:main"
boring-crocodile-mcp = "boring_crocodile.control_plane:main"
boring-crocodile-worker = "boring_crocodile.worker:main"
boring-crocodile-task = "boring_crocodile.task_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boring_crocodile = ["templates/*.md", "templates/services/*.in"]

# Deliberately scoped gate: strict boundary contracts, not a suppressed repo-wide baseline.
[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
files = ["src/boring_crocodile/pirate_authority.py", "src/boring_crocodile/pirates.py", "src/boring_crocodile/admin.py", "src/boring_crocodile/control_plane.py", "src/boring_crocodile/outcomes.py", "src/boring_crocodile/settings.py", "src/boring_crocodile/batch.py"]
