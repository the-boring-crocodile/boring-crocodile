# The one check: the same command as on a workstation (scripts/check.py).
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Pond Common is built from the commit in .common-ref; its build is
      # reproducible, so the wheels match the hashes in requirements.lock.
      - id: common
        run: echo "ref=$(cat .common-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-pond-common
          ref: ${{ steps.common.outputs.ref }}
          path: .deps/boring-pond-common
      - run: python .deps/boring-pond-common/scripts/build.py --out .deps/common-dist
      - run: python scripts/check.py --common-wheels .deps/common-dist
